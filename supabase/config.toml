project_id = "derabona"

[auth]
site_url = "https://derabona.club"
additional_redirect_urls = ["http://localhost:4173", "http://127.0.0.1:4173"]

# Functions validate bearer tokens with Supabase Auth getUser(). The public
# leaderboard must work without a JWT; modern publishable keys are not JWTs.
[functions.ranked-game]
verify_jwt = false

[functions.account-delete]
verify_jwt = false

# Private Daily leagues: every action requires a verified, non-anonymous user,
# checked in the function with getUser() like the endpoints above.
[functions.private-leagues]
verify_jwt = false

# Daily email reminders (ADR 0030). email-preferences verifies the user with
# getUser() like the endpoints above. The worker authenticates the scheduler
# with its own X-Reminder-Worker-Secret, and the webhook with EmailOctopus's
# HMAC signature; neither accepts a user JWT.
[functions.email-preferences]
verify_jwt = false

[functions.email-reminders-worker]
verify_jwt = false

[functions.emailoctopus-webhook]
verify_jwt = false
